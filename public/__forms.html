<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SSG form definitions</title></head><body>
<!-- Static form skeleton for Netlify Form detection in Next.js -->
<form name="ssg-products-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="ssg-products-interest" />
<input type="text" name="bot-field" />
<input type="text" name="name" />
<input type="email" name="email" />
<input type="text" name="product" />
<textarea name="message"></textarea>
<input type="text" name="consent" />
</form></body></html>
